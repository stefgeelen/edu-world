<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Leapio">
  <title>Leapio — een fluisterboom in het nachtelijke bos</title>
  <!--
    Source of truth for the app icon. Rasterised to icon-512, icon-192 and
    apple-touch-icon by scripts/build-icons.sh — edit this file, never the PNGs.

    Palette comes straight from the grade-1 world theme (src/data/worldThemes.ts):
    the night-forest purples of the quest map, the emerald-to-teal of its path
    gradient, and the amber its world title glows in.

    A broad-leaved tree rather than a pine on purpose: a glowing conifer against
    a night sky with sparkles reads as Christmas, which is the wrong association
    for something a family opens in March.

    Everything sits inside the central 80% circle, so the same artwork survives
    Android's maskable crop without losing an edge.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f2a7a"/>
      <stop offset="55%" stop-color="#241650"/>
      <stop offset="100%" stop-color="#120b2b"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="46%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#facc15" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <!-- userSpaceOnUse so one continuous gradient runs across the whole crown.
         Per-object units would shade each circle separately and the canopy
         would read as four loose balls. -->
    <linearGradient id="crown" gradientUnits="userSpaceOnUse" x1="150" y1="90" x2="380" y2="320">
      <stop offset="0%" stop-color="#6ee7cf"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#046c4e"/>
    </linearGradient>

    <linearGradient id="trunk" gradientUnits="userSpaceOnUse" x1="236" y1="0" x2="278" y2="0">
      <stop offset="0%" stop-color="#c08a56"/>
      <stop offset="100%" stop-color="#7a5231"/>
    </linearGradient>

    <clipPath id="crownClip">
      <circle cx="256" cy="180" r="86"/>
      <circle cx="180" cy="232" r="68"/>
      <circle cx="332" cy="232" r="68"/>
      <circle cx="256" cy="244" r="74"/>
    </clipPath>

    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <ellipse cx="256" cy="412" rx="104" ry="20" fill="#0d0a22" opacity="0.5"/>

  <path d="M256 414 L256 292" stroke="url(#trunk)" stroke-width="34" stroke-linecap="round" fill="none"/>

  <g fill="url(#crown)">
    <circle cx="256" cy="180" r="86"/>
    <circle cx="180" cy="232" r="68"/>
    <circle cx="332" cy="232" r="68"/>
    <circle cx="256" cy="244" r="74"/>
  </g>

  <!-- Moonlight on the canopy: blurred and clipped so it lifts the shape
       instead of sitting on it as a separate bubble. -->
  <g clip-path="url(#crownClip)">
    <circle cx="214" cy="152" r="58" fill="#a7f3d0" opacity="0.30" filter="url(#soften)"/>
  </g>

  <!-- Whispered light. Four-point stars, the shape the app already uses for XP. -->
  <g fill="#fde68a">
    <path d="M110 186 q7 20 22 26 q-15 6 -22 26 q-7 -20 -22 -26 q15 -6 22 -26 Z" opacity="0.9"/>
    <path d="M404 216 q5 14 16 19 q-11 4 -16 19 q-5 -15 -16 -19 q11 -5 16 -19 Z" opacity="0.7"/>
  </g>
</svg>
